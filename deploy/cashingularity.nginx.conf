# Cloudflare Tunnel example. Include from nginx's http context.
map $http_upgrade $cashingularity_connection {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8080;
    server_name play.example.com;
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    client_max_body_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $cashingularity_connection;
    proxy_read_timeout 75s;

    location ~ /\. { return 404; }
    location = /api/markets/positions { return 404; }
    location = /verification-frame.html { return 404; }
    location = /verification-frame.js { return 404; }
    location = /verification-frame.css { return 404; }

    location ~ "^/api/(health|rates|markets(/[a-zA-Z0-9-]+)?|bcmr/[a-fA-F0-9]{64}|(chain|wallet)/(history|utxos)|arcade/rocket-race/(leaderboard|online/leaderboard))$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/api/((chain/|wallet/)?broadcast|markets/[0-9]+/paper-flow|payroll/parse|contracts/prepare|auth/(register|login|logout|totp/(setup|verify))|arcade/rocket-race/(challenges|results))$ {
        if ($request_method != POST) { return 404; }
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/ws(/wallet|/arcade/rocket-race)?$ {
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/(api|ws)(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name verify.example.com;
    location ~ ^/verification-frame\.(html|js|css)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:3001;
    }
    location / { return 404; }
}
